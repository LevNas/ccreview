# An example of ccreview's gate declarations. Copy it to .claude/review-gates.yaml in the repository under review and edit it.
#
# The perspectives' text lives in REVIEW.md. This file says only what to run and what counts as a pass.
# The ccreview skill reads this file and hands the workflow only the gates whose paths match.
#
# max_rounds  The limit on review-and-fix rounds
# Keys of each gate under gates:
#   id        The gate's name. It is part of the "same reason" key of the stop condition (id|path|category),
#             so renaming it breaks the comparison with earlier runs
#   kind      perspective (a review through a REVIEW.md section) | command (a command's exit code) | review (the built-in /code-review)
#             | pr-body (the PR body has the required sections; run by the skill in the main session, not for a branch with no PR)
#   require   pr-body only. One item per required section: heading names separated by "|", any one of which will do.
#             Any heading level; case and surrounding spaces are ignored. A section passes when it has text of its own
#   ref       perspective only. A REVIEW.md section heading, written exactly as it appears
#   passes    perspective only. How many independent passes through the same perspective (findings are merged). 1 when omitted
#   run       command only. {files} is replaced with the changed files matching paths (space-separated).
#             The skill runs it once at the repository root before the workflow (not when the PR is judged untrusted).
#             In the rounds after a fix, the fix agent runs it and reports. So write a single command.
#             A command containing ; & | ` $ < > or a newline, or matching an ask or deny rule in the settings, is not run
#             by the fix agent: it is "deferred", and the skill runs it at the end in the main session to settle the verdict
#             (ask-rule commands prompt for confirmation)
#   effort    review only. medium when omitted
#   pass      perspective and review: no-blocking (passes when there is no blocking finding) or max-findings:N (passes when
#             the gate has N findings or fewer, nits included; max-findings:0 fails on a single nit).
#             command: exit0 (passes on exit code 0). exit0 on a perspective or review gate makes a gate that never fails
#   blocking  When false, a failure does not block the merge (it is only reported)
#   autofix   agent lets the fix agent fix the findings. none does not
#   paths     Run only when a changed file matches one of these globs. Always runs when omitted.
#             The skill (the main session) does the matching, and no glob dialect is fixed. To be sure root files
#             are included, list both, as in "*.py" and "**/*.py"

max_rounds: 3

gates:
  # Reviews by perspective. Overlapping perspectives make up for what a single reviewer misses.
  - id: correctness
    kind: perspective
    ref: "Correctness"
    pass: no-blocking
    blocking: true
    autofix: agent

  - id: security
    kind: perspective
    ref: "Security and secrets"
    pass: no-blocking
    blocking: true
    autofix: agent

  - id: docs-links
    kind: perspective
    ref: "Docs and links"
    pass: no-blocking
    blocking: true
    autofix: agent

  - id: cross-file
    kind: perspective
    ref: "Cross-file consistency"
    pass: no-blocking
    blocking: true
    autofix: agent

  # A command gate. Runs a linter or tests on the changed files only.
  # - id: lint
  #   kind: command
  #   run: "ruff check {files}"
  #   pass: exit0
  #   blocking: true
  #   autofix: agent
  #   paths: ["*.py", "**/*.py"]

  # A PR body gate. Checks that the body says what was shown and what was not; not whether it is true.
  # - id: pr-evidence
  #   kind: pr-body
  #   require: ["Evidence", "Not tested"]
  #   blocking: true

  # The built-in /code-review as one gate. It can compare against the local main,
  # so keep main up to date with the base if you use it.
  # - id: code-review
  #   kind: review
  #   effort: medium
  #   pass: no-blocking
  #   blocking: true
  #   autofix: agent
